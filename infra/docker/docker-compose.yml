# Local full stack: Postgres + Redis (+ api, worker, web with --profile app).
#   pnpm infra:up                                    -> only Postgres and Redis, run apps with pnpm dev
#   docker compose -f infra/docker/docker-compose.yml --profile app up --build   -> everything in containers
name: tranche

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ needs noeviction: an evicted job key is a lost payment job.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: api/Dockerfile
    env_file: ../env/api.docker.env
    environment:
      APP_ROLE: api
      SEED_ON_BOOT: demo
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: api/Dockerfile
    env_file: ../env/api.docker.env
    environment:
      APP_ROLE: worker
    depends_on:
      api: { condition: service_started }

  web:
    profiles: ["app"]
    build:
      context: ../..
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
