name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and typecheck (all workspaces)
        run: pnpm turbo run lint typecheck
      - name: Unit tests (shared)
        run: pnpm turbo run test --filter=@tranche/shared
      - name: Build api and web
        run: pnpm turbo run build --filter=api --filter=web
        env:
          NEXT_PUBLIC_API_URL: https://tranche-api.onrender.com/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: shared-coverage
          path: shared/coverage/lcov.info
          if-no-files-found: ignore

  api-tests:
    name: API tests (Jest + Supertest, Postgres, Redis)
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tranche_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: tranche_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      LOG_LEVEL: error
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tranche/shared build
      - name: Generate throwaway JWT keys
        run: node api/scripts/generate-keys.js >> "$GITHUB_ENV"
      - name: Migrations apply cleanly and match the entities
        working-directory: api
        run: |
          pnpm db:migrate
          pnpm db:check
      - name: Unit + integration tests with coverage
        run: pnpm --filter api test:all
      - name: Coverage summary
        if: always()
        run: node infra/scripts/coverage-summary.js api/coverage/all/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: shared-coverage
          path: shared/coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          files: api/coverage/all/lcov.info,shared/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  app:
    name: Mobile app (typecheck, lint, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tranche/shared build
      - run: pnpm --filter app typecheck
      - run: pnpm --filter app lint
      - name: Expo dependency check
        working-directory: app
        run: npx expo install --check
      - name: Bundle for Android (proves Metro resolves the workspace)
        working-directory: app
        run: npx expo export --platform android --output-dir dist

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: tranche-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          tags: tranche-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
